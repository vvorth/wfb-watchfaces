format: 2

face:
  id: 39bc34a8-ccbf-46ba-9905-c6ca887aff4b
  name: Fenix Orbital
  version: 3.11.0

build:
  targets: [fenix847mm]

defaults:
  aod: { visible: false }

resources:
  palette:
    white: "#F1F7FF"
    soft: "#B5C6DA"
    ice: "#91C7FF"
    orbit: "#667D9B"
    linework: "#536982"
    guide: "#3D506A"
    grid: "#28374A"
  fonts:
    clock:
      source: assets/orbital-ui/InterDisplay-Light.ttf
      size: 82px
    reading:
      source: assets/orbital-ui/Inter-Regular.ttf
      size: 26px
    label:
      source: assets/orbital-ui/Inter-Medium.ttf
      size: 17px

    micro:
      source: assets/orbital-ui/Inter-Medium.ttf
      size: 13px
    small:
      source: assets/orbital-ui/Inter-Regular.ttf
      size: 21px
    forecast:
      source: assets/orbital-ui/Inter-Regular.ttf
      size: 20px

    metric:
      source: assets/orbital-condensed/BarlowCondensed-ExtraLight.ttf
      size: 32px

    physiology_radial:
      face: RobotoCondensedRegular
      size: 26px
    date_numeric:
      source: assets/orbital-ui/Inter-Medium.ttf
      size: 20px
      tabular_digits: true
    rain_reading:
      source: assets/orbital-ui/Inter-Regular.ttf
      size: 24px
      tabular_digits: true
    battery_reading:
      source: assets/orbital-ui/Inter-Medium.ttf
      size: 16px
      tabular_digits: true

  hand_sets:
    orbital_markers:
      hour:
        color: color.data
        parts:
          diamond:
            type: polygon
            points: [{ dy: -220px }, { dx: 8px, dy: -212px }, { dy: -204px }, { dx: -8px, dy: -212px }]
      minute:
        color: color.data
        parts:
          upper_right: { type: line, at: { dy: -222px }, to: { dx: 10px, dy: -212px }, thickness: 2px }
          lower_right: { type: line, at: { dx: 10px, dy: -212px }, to: { dy: -202px }, thickness: 2px }
          lower_left: { type: line, at: { dy: -202px }, to: { dx: -10px, dy: -212px }, thickness: 2px }
          upper_left: { type: line, at: { dx: -10px, dy: -212px }, to: { dy: -222px }, thickness: 2px }
      second:
        color: color.data
        parts:
          sphere: { type: circle, at: { dy: -212px }, radius: 6px }

static:
  native_background:
    type: image
    png: ""
    at: { anchor: center, dx: 1%r }
    aod: { visible: false }
    lint: { allow: [safe-area], reason: "The round panel clips the full-screen background bitmap." }

  sphere_geometry:
    type: group
    children:
      lower_horizon:
        type: circle
        at: { anchor: center, dy: 600px }
        radius: 600px
        filled: false
        color: color.geometry_outer
        lint: { allow: [off-screen, safe-area], reason: "Only the upper horizon of this large sphere is visible on the round panel." }
      upper_right:
        type: circle
        at: { anchor: center, dx: 150px, dy: -89px }
        radius: 37px
        filled: false
        color: color.geometry_outer
      central_cutout:
        type: circle
        at: { anchor: center }
        radius: 114px
        color: "#000000"

  outer_dots:
    type: pattern
    pattern: radial
    count: 60
    color: color.geometry_outer
    parts:
      dot: { type: circle, at: { dy: -220px }, radius: 1px }

  inner_dots:
    type: pattern
    pattern: radial
    count: 60
    start: 0deg
    color: color.geometry_guide
    parts:
      dot: { type: circle, at: { dy: -214px }, radius: 1px }

  radial_ticks:
    type: pattern
    pattern: radial
    count: 60
    color: color.geometry_guide
    parts:
      tick: { type: line, at: { dy: -207px }, to: { dy: -198px }, thickness: 1px }











  chart_diagonals:
    type: group
    children:
      left_node: { type: circle, at: { dx: -201px, dy: -186px }, radius: 15px, filled: false, color: color.geometry_outer }

  chart_rings:
    type: group
    children:
      inner: { type: circle, radius: 60px, filled: false, color: color.geometry_dim, at: { dy: -60%r, dx: 0.5%r }, thickness: 2px }
      middle: { type: circle, radius: 200px, filled: false, color: color.geometry_guide, at: { dx: 0%r, dy: 101.9%r } }
      outer: { type: circle, radius: 114px, filled: false, color: color.geometry_dim, thickness: 2px }

elements:
  # Seven upright poses preserve all four selected figures with no line shared by neighbors.
  # Every track has two exact 120-degree copies throughout the transition.
  bank_1_1:
    type: gauge
    style: needle
    value: &bank_1_turn >-
      (time.orbital_phase < 1 ? 0 : time.orbital_phase < 2 ? 90 : time.orbital_phase < 3 ? 0 : time.orbital_phase < 4 ? 90 : time.orbital_phase < 5 ? 0 : time.orbital_phase < 6 ? 0 : 0) +
      (time.orbital_phase < 1 ? 30 : time.orbital_phase < 2 ? 30 : time.orbital_phase < 3 ? 30 : time.orbital_phase < 4 ? 30 : time.orbital_phase < 5 ? 30 : time.orbital_phase < 6 ? 60 : 60) * time.orbital_transition * time.orbital_transition * (3 - 2 * time.orbital_transition)
    max: 180
    start_angle: 0deg
    sweep: 180deg
    needle_offset: &bank_1_distance >-
      (time.orbital_phase < 1 ? 113.5 : time.orbital_phase < 2 ? 113.5 : time.orbital_phase < 3 ? 173.892089 : time.orbital_phase < 4 ? 113.5 : time.orbital_phase < 5 ? 196.587767 : time.orbital_phase < 6 ? 113.5 : -113.5) +
      (time.orbital_phase < 1 ? -227 : time.orbital_phase < 2 ? 60.392089 : time.orbital_phase < 3 ? -60.392089 : time.orbital_phase < 4 ? 83.087767 : time.orbital_phase < 5 ? -196.587767 : time.orbital_phase < 6 ? 0 : 0) * time.orbital_transition * time.orbital_transition * (3 - 2 * time.orbital_transition)
    color: color.geometry_lines
    lint: &clip_axis { allow: [safe-area], reason: "The round dial clips each line to its chord." }
    needle: &axis_line
      stroke: { type: line, at: { dx: -455px }, to: { dx: 455px } }

  bank_1_2:
    type: gauge
    style: needle
    value: *bank_1_turn
    max: 180
    start_angle: 120deg
    sweep: 180deg
    needle_offset: *bank_1_distance
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  bank_1_3:
    type: gauge
    style: needle
    value: *bank_1_turn
    max: 180
    start_angle: 240deg
    sweep: 180deg
    needle_offset: *bank_1_distance
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  bank_2_1:
    type: gauge
    style: needle
    value: &bank_2_turn >-
      (time.orbital_phase < 1 ? 0 : time.orbital_phase < 2 ? 90 : time.orbital_phase < 3 ? 40 : time.orbital_phase < 4 ? 0 : time.orbital_phase < 5 ? 0 : time.orbital_phase < 6 ? 90 : 0) +
      (time.orbital_phase < 1 ? 30 : time.orbital_phase < 2 ? 50 : time.orbital_phase < 3 ? 50 : time.orbital_phase < 4 ? 60 : time.orbital_phase < 5 ? 60 : time.orbital_phase < 6 ? 30 : 60) * time.orbital_transition * time.orbital_transition * (3 - 2 * time.orbital_transition)
    max: 180
    start_angle: 0deg
    sweep: 180deg
    needle_offset: &bank_2_distance >-
      (time.orbital_phase < 1 ? 113.5 : time.orbital_phase < 2 ? 0 : time.orbital_phase < 3 ? 173.892089 : time.orbital_phase < 4 ? 113.5 : time.orbital_phase < 5 ? -196.587767 : time.orbital_phase < 6 ? 0 : -56.75) +
      (time.orbital_phase < 1 ? -113.5 : time.orbital_phase < 2 ? -173.892089 : time.orbital_phase < 3 ? -60.392089 : time.orbital_phase < 4 ? 0 : time.orbital_phase < 5 ? 83.087767 : time.orbital_phase < 6 ? 0 : -56.75) * time.orbital_transition * time.orbital_transition * (3 - 2 * time.orbital_transition)
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  bank_2_2:
    type: gauge
    style: needle
    value: *bank_2_turn
    max: 180
    start_angle: 120deg
    sweep: 180deg
    needle_offset: *bank_2_distance
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  bank_2_3:
    type: gauge
    style: needle
    value: *bank_2_turn
    max: 180
    start_angle: 240deg
    sweep: 180deg
    needle_offset: *bank_2_distance
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  bank_3_1:
    type: gauge
    style: needle
    value: &bank_3_turn >-
      (time.orbital_phase < 1 ? 0 : time.orbital_phase < 2 ? 90 : time.orbital_phase < 3 ? 80 : time.orbital_phase < 4 ? 90 : time.orbital_phase < 5 ? 0 : time.orbital_phase < 6 ? 0 : 0) +
      (time.orbital_phase < 1 ? 30 : time.orbital_phase < 2 ? 10 : time.orbital_phase < 3 ? 40 : time.orbital_phase < 4 ? 30 : time.orbital_phase < 5 ? 60 : time.orbital_phase < 6 ? 60 : 60) * time.orbital_transition * time.orbital_transition * (3 - 2 * time.orbital_transition)
    max: 180
    start_angle: 0deg
    sweep: 180deg
    needle_offset: &bank_3_distance >-
      (time.orbital_phase < 1 ? 113.5 : time.orbital_phase < 2 ? -113.5 : time.orbital_phase < 3 ? 173.892089 : time.orbital_phase < 4 ? -113.5 : time.orbital_phase < 5 ? -113.5 : time.orbital_phase < 6 ? 113.5 : 0) +
      (time.orbital_phase < 1 ? 0 : time.orbital_phase < 2 ? -60.392089 : time.orbital_phase < 3 ? -60.392089 : time.orbital_phase < 4 ? -83.087767 : time.orbital_phase < 5 ? 0 : time.orbital_phase < 6 ? -56.75 : -113.5) * time.orbital_transition * time.orbital_transition * (3 - 2 * time.orbital_transition)
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  bank_3_2:
    type: gauge
    style: needle
    value: *bank_3_turn
    max: 180
    start_angle: 120deg
    sweep: 180deg
    needle_offset: *bank_3_distance
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  bank_3_3:
    type: gauge
    style: needle
    value: *bank_3_turn
    max: 180
    start_angle: 240deg
    sweep: 180deg
    needle_offset: *bank_3_distance
    color: color.geometry_lines
    lint: *clip_axis
    needle: *axis_line

  solar_daylight:
    type: pattern
    pattern: radial
    count: 360
    start: 180deg
    at:
      anchor: center
    color: color.accent
    absent: hide
    parts:
      span:
        type: arc
        radius: 212px
        start_angle: 0deg
        sweep: 1deg
        thickness: 1px
        visible: copy >= floor(complication.sunrise / 240 + 0.5) and copy < floor(complication.sunset / 240 + 0.5)
  solar_sunrise:
    type: gauge
    style: needle
    at: &a1
      anchor: center
    value: complication.sunrise
    max: 86400
    start_angle: 180deg
    sweep: 360deg
    color: color.accent
    absent: hide
    visible: complication.sunrise >= 0 and complication.sunset > complication.sunrise
    needle:
      tick:
        type: line
        at:
          dy: -209px
        to:
          dy: -215px
        thickness: 1px
  solar_sunset:
    type: gauge
    style: needle
    at: *a1
    value: complication.sunset
    max: 86400
    start_angle: 180deg
    sweep: 360deg
    color: color.accent
    absent: hide
    visible: complication.sunrise >= 0 and complication.sunset > complication.sunrise
    needle:
      tick:
        type: line
        at:
          dy: -209px
        to:
          dy: -215px
        thickness: 1px
  solar_now:
    type: gauge
    style: needle
    at: *a1
    value: time.hour * 3600 + time.minute * 60 + time.second
    max: 86400
    start_angle: 180deg
    sweep: 360deg
    color: color.data
    needle:
      point:
        type: circle
        at:
          dy: -212px
        radius: 3px
  clock:
    type: text
    text: "{time.clock:%h:%M}"
    font: font.clock
    at:
      anchor: center
      dx: 0px
      dy: 0px
    align: center
    color: color.data
    aod:
      visible: true
      dim: 0.33
  seconds:
    type: text
    text: "{time.second:02d}"
    font: font.reading
    at:
      anchor: center
      dx: 142px
      dy: 0px
    color: color.soft
    align: left
  period:
    type: text
    text: "{time.clock:%p}"
    font: font.micro
    at:
      anchor: center
      dx: 132px
      dy: 37px
    color: color.data
    visible: "!device.is_24_hour"
  weekdays:
    type: pattern
    pattern: linear
    count: 7
    at:
      anchor: center
      dx: -57px
      dy: -61px
    step:
      dx: 19px
    parts:
      letter:
        type: text
        font: font.label
        text: "{(copy == 0 ? 'M' : copy == 1 ? 'T' : copy == 2 ? 'W' : copy == 3 ? 'T' : copy == 4 ? 'F' : 'S')}"
        color: "copy == (date.weekday + 5) % 7 ? color.data : color.soft"
      current_day:
        type: line
        at:
          dx: -5px
          dy: 13px
        to:
          dx: 5px
          dy: 13px
        color: color.accent
        thickness: 2px
        visible: copy == (date.weekday + 5) % 7
  date:
    type: text
    text: "{date.today:%d.%m.%Y}"
    font: font.date_numeric
    at:
      anchor: center
      dx: 0px
      dy: 84px
    color: color.soft
  battery_icon:
    type: group
    at:
      anchor: center
      dx: 1px
      dy: -110px
    size:
      width: 54px
      height: 24px
    children:
      backing:
        type: rectangle
        size:
          width: 48px
          height: 22px
        corner_radius: 2px
        color: "#000000"
      charge:
        type: gauge
        style: bar
        value: system.battery
        max: 100
        at:
          dx: -22px
          dy: 0px
        align: left
        size:
          width: 44px
          height: 18px
        color: color.geometry_guide
      casing:
        type: rectangle
        size:
          width: 48px
          height: 22px
        corner_radius: 2px
        filled: false
        thickness: 1px
        color: color.accent
      terminal:
        type: rectangle
        at:
          dx: 26px
          dy: 0px
        size:
          width: 2px
          height: 8px
        corner_radius: 1px
        color: color.accent
  battery:
    type: text
    text: "{system.battery:d}%"
    font: font.battery_reading
    at:
      anchor: center
      dx: 1px
      dy: -109px
    color: color.data
    align: center
  moon_phase:
    type: icon
    icon:
      for: astro.moon_age
    size: 34px
    at:
      anchor: center
      dx: 151px
      dy: -87px
    color: color.accent
  moon_illumination:
    type: text
    text: "{astro.moon_illumination * 100:.0f}%"
    font: font.micro
    at:
      anchor: center
      dx: 152px
      dy: -51px
    color: color.soft
  wind_direction:
    type: gauge
    style: needle
    value: weather.wind_bearing
    max: 360
    start_angle: 0deg
    sweep: 360deg
    at:
      anchor: center
      dx: 88px
      dy: -107px
    color: color.accent
    absent: hide
    needle:
      shaft:
        type: line
        at:
          dy: 9px
        to:
          dy: -10px
        thickness: 1px
      tip:
        type: polygon
        points:
          - dy: -12px
          - dx: 4px
            dy: -4px
          - dx: -4px
            dy: -4px
  wind_speed:
    type: group
    at:
      anchor: center
      dx: 131px
      dy: 118px
    size:
      width: 64px
      height: 42px
    children:
      value:
        type: text
        text: "{weather.wind_speed:.1f}"
        font: font.small
        at:
          dy: -268px
          dx: -43px
        color: color.data
        absent:
          text: --
      unit:
        type: text
        text: m/s
        font: font.small
        at:
          dy: -247px
          dx: -43px
        color: color.soft
  steps:
    type: text
    text: "{activity.steps:d}"
    font: font.physiology_radial
    at:
      anchor: center
      dx: -143px
      dy: 1px
    color: color.data
    absent:
      text: --
    align: right
    curve:
      style: angled
      angle: 0deg
  body_battery:
    type: text
    text: "{complication.body_battery:d}"
    font: font.physiology_radial
    at:
      anchor: center
      dx: -134px
      dy: -71px
    color: color.data
    absent:
      text: --
    align: right
    curve:
      style: angled
      angle: 0deg
  heart_icon:
    type: group
    size:
      width: 26px
      height: 24px
    at:
      anchor: center
      dx: 0px
      dy: -180px
    children:
      left_lobe:
        type: arc
        at:
          dx: -5px
          dy: -3px
        radius: 5px
        start_angle: 220deg
        sweep: 230deg
        thickness: 1px
        color: color.accent
      right_lobe:
        type: arc
        at:
          dx: 5px
          dy: -3px
        radius: 5px
        start_angle: 270deg
        sweep: 230deg
        thickness: 1px
        color: color.accent
      left_point:
        type: line
        at:
          dx: -8px
          dy: 1px
        to:
          dy: 9px
        color: color.accent
      right_point:
        type: line
        at:
          dx: 8px
          dy: 1px
        to:
          dy: 9px
        color: color.accent
  heart_rate:
    type: text
    text: "{heart_rate.current:d}"
    font: font.reading
    at:
      anchor: center
      dx: 0px
      dy: -152px
    color: color.data
    absent:
      text: --
  heart_rate_label:
    type: text
    text: bpm
    font: font.micro
    at:
      anchor: center
      dx: 0px
      dy: -134px
    color: color.soft
  recovery_time:
    type: text
    text: "{floor((complication.recovery_time + 59) / 60):d} h"
    font: font.physiology_radial
    at:
      anchor: center
      dx: -143.247px
      dy: -35px
    color: color.data
    absent:
      text: -- h
    align: right
    curve:
      style: angled
      angle: 0deg
  sunrise_icon:
    type: group
    size:
      width: 30px
      height: 28px
    at:
      anchor: center
      dx: -151px
      dy: 41px
    children:
      sun:
        type: arc
        at:
          dy: 3px
        radius: 6px
        start_angle: 270deg
        sweep: 180deg
        color: color.accent
      horizon:
        type: line
        at:
          dx: -13px
          dy: 4px
        to:
          dx: 13px
          dy: 4px
        color: color.accent
      up:
        type: polygon
        points:
          - dy: -12px
          - dx: 3px
            dy: -7px
          - dx: -3px
            dy: -7px
        color: color.accent
  sunrise:
    type: text
    text: "{complication.sunrise:%H:%M}"
    font: font.small
    at:
      anchor: center
      dx: -151px
      dy: 67px
    color: color.soft
    absent:
      text: --:--
  weather_icon:
    type: group
    size:
      width: 36px
      height: 34px
    at:
      anchor: center
      dx: 0px
      dy: 108px
    children:
      clear:
        type: group
        visible: weather.condition_today == 0
        children:
          disc:
            type: circle
            radius: 6px
            filled: false
            color: color.accent
          rays:
            type: pattern
            pattern: radial
            count: 8
            color: color.accent
            parts:
              ray:
                type: line
                at:
                  dy: -13px
                to:
                  dy: -9px
      cloud:
        type: group
        visible: weather.condition_today > 0
        children:
          left:
            type: arc
            at:
              dx: -9px
              dy: 1px
            radius: 5px
            start_angle: 180deg
            sweep: 170deg
            color: color.accent
          crown:
            type: arc
            at:
              dx: -2px
              dy: -3px
            radius: 7px
            start_angle: 265deg
            sweep: 170deg
            color: color.accent
          right:
            type: arc
            at:
              dx: 8px
              dy: 1px
            radius: 5px
            start_angle: 340deg
            sweep: 200deg
            color: color.accent
          base:
            type: line
            at:
              dx: -9px
              dy: 6px
            to:
              dx: 8px
              dy: 6px
            color: color.accent
        at:
          dx: 0.5%r
          dy: 1.8%r
      rain:
        type: group
        visible: weather.condition_today == 3 or weather.condition_today == 6 or weather.condition_today == 11 or weather.condition_today == 14 or
          weather.condition_today == 15 or (weather.condition_today >= 24 and weather.condition_today <= 27) or weather.condition_today == 31
          or weather.condition_today == 42 or weather.condition_today == 45
        children:
          left:
            type: line
            at:
              dx: -4px
              dy: 9px
            to:
              dx: -7px
              dy: 13px
            color: color.accent
          right:
            type: line
            at:
              dx: 5px
              dy: 9px
            to:
              dx: 2px
              dy: 13px
            color: color.accent
        at:
          dx: 0.5%r
          dy: 1.8%r
      snow:
        type: group
        visible: weather.condition_today == 4 or weather.condition_today == 7 or weather.condition_today == 10 or weather.condition_today == 12 or
          weather.condition_today == 13 or (weather.condition_today >= 16 and weather.condition_today <= 19) or weather.condition_today == 21
          or weather.condition_today == 34 or weather.condition_today == 43 or weather.condition_today == 44 or (weather.condition_today >= 46
          and weather.condition_today <= 48)
        children:
          left:
            type: circle
            at:
              dx: -5px
              dy: 11px
            radius: 1px
            color: color.accent
          right:
            type: circle
            at:
              dx: 4px
              dy: 12px
            radius: 1px
            color: color.accent
  temperature:
    type: group
    at:
      anchor: center
      dx: -114px
      dy: 123px
    size:
      width: 64px
      height: 42px
    children:
      value:
        type: text
        text: "{weather.temperature:.0f}"
        font: font.small
        at:
          dy: -271px
          dx: 30px
        color: color.data
        absent:
          text: --
      unit:
        type: text
        text: "°C"
        font: font.small
        at:
          dy: -249px
          dx: 26px
        color: color.soft
  sunset_icon:
    type: group
    size:
      width: 30px
      height: 28px
    at:
      anchor: center
      dx: 151px
      dy: 41px
    children:
      sun:
        type: arc
        at:
