        geometry_guide: color.guide
        geometry_dim: color.grid
    mono:
      label: MONO LINES
      colors:
        geometry_outer: "#929292"
        geometry_lines: "#707070"
        geometry_guide: "#505050"
        geometry_dim: "#373737"
    gold:
      label: GOLD LINES
      colors:
        geometry_outer: "#9B8866"
        geometry_lines: "#827053"
        geometry_guide: "#6A563D"
        geometry_dim: "#4A3B28"
    violet:
      label: VIOLET LINES
      colors:
        geometry_outer: "#82739E"
        geometry_lines: "#6E6085"
        geometry_guide: "#53466A"
        geometry_dim: "#3B304A"
    mint:
